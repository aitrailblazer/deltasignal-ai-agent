    <Category name="Evidence Boundaries &amp; Non-Advice Discipline" severity="low">
      <Positive>Repeated, prominent, consistent language across index, quickstart, llms-full.txt, and CLAUDE.md: "Evidence first. Narrative second.", "preserve source_date, computed_at, stale, caveats, quality_flags, evidence_hash, payload_mode, route/tool provenance, non-advice boundary".</Positive>
      <Positive>Explicit non-advice disclaimer on every brief and in refusal policies. Matches local project code (DefaultTripCodeDisclosures, Gemini prompts, response fields) and CLAUDE.md output policy.</Positive>
      <Positive>"Missing evidence remains missing" rule is enforced in policy, error shapes, and agent instructions. Soft-miss states documented.</Positive>
      <Positive>Natural Language briefs (the "StrategiX" Markdown layer) are correctly positioned as *renderers/compilers* of returned evidence, not new sources. Deterministic fallback and validation model described.</Positive>
    </Category>

    <Category name="TripCode / River / Subscriber Research" severity="medium">
      <Positive>Strong, repeated discovery-gating language: "TripCode tools are valid only when available in the active MCP surface", "If discovery does not expose... do not pretend they are callable", "report missing River/index blobs as missing/unavailable".</Positive>
      <Positive>HUT-specific caveats preserved (TF-SUB-9DA70A7F98, 10-node River, missing TF-RIVER-HUT and issuer index blobs, "local/source proof" vs public). This directly mirrors the local deltasignal-ai-agent CLAUDE.md, test fixtures, and prior audit notes.</Positive>
      <Positive>Subscriber flow (resolve article → list nodes → thesis map → compare to filing evidence) and pricing are documented with clear "if exposed" qualifiers.</Positive>
      <Observation>Public site still positions TripCode as "near-term extension" / product direction with heavy caveats. This is responsible and aligned with the state noted in the concurrent local agent audit (public MCP had been reported stale for new TripCode tools at earlier dates; June 8 llms-full shows hardening progress but retains the guardrails).</Observation>
    </Category>

    <Category name="MCP, x402, Arazzo, OpenAPI Contracts" severity="low">
      <Positive>Excellent agent contracts: exact MCP install paths (npx @coinbase/payments-mcp + claude mcp add), Glama connector, Arazzo YAML/JSON for workflow planning, public x402 handshake Arazzo, OpenAPI 56 paths reference.</Positive>
      <Positive>Clear reviewer lifecycle for Coinbase x402 / Codex marketplace: discover → inspect metadata → 402 challenge → pay/retry with proof → inspect provenance. Matches the "validate the paid route" policy in local CLAUDE.md.</Positive>
      <Positive>Readiness probe emphasized as first step; plain unauthenticated requests correctly expected to return 402 in many cases. Grant paths (identity headers, signed wallet grants) documented.</Positive>
      <Positive>Composite-first policy ("use composites for Morning Brief, Company Report...") and granular tool list align with local agent coordinator design and AGENTS.md recommendations.</Positive>
    </Category>

    <Category name="Alignment with Local deltasignal-ai-agent" severity="low">
      <Positive>Site is the public ATLAS-7 service layer that the local Go Cloud Run + Gemini agent (the competition entry we previously audited) consumes as its authorized integration/data source.</Positive>
      <Positive>Workflows promoted (Morning Brief, Company Report, Pressure Board, Alpha Sweep, Quick Ticker Check, readiness, daily changes, SPECTRA) exactly match the specialist lanes, ToolClient interface, and demo/live paths in local cmd/server, coordinator.go, atlas_mcp.go, and tripcode routes.</Positive>
      <Positive>HUT TripCode proof case (TF-SUB-9DA70A7F98), session memory / River continuity, and judge-demo flow are consistent with local tests, scripts/judge-demo.sh, and submission packet.</Positive>
      <Positive>Local project StrategiX artifacts (submission packet, landing, CHANGELOG, private specs) link to this site as "ATLAS-7 Codex Plugin". The local agent is positioned as the "orchestration layer" / "new autonomous agent" on top of this existing authorized backend.</Positive>
      <Positive>Cost tracking posture (local-estimate in agent, route-level pricing here) and demo-key protection are complementary.</Positive>
    </Category>

    <Category name="Claims, Live Status &amp; Provenance" severity="medium">
      <Positive>llms-full.txt and changelog-llm.html provide dated, tripcode-identified, river-ordered provenance (e.g., ATLAS-JUN-8-LIVE-READINESS-MCP-EVIDENCE-HARDENING, source commit 4cb93a38, revision ca-web-intel-mcp--0000484, 97.5% coverage checkpoint, OpenAPI 56 paths).</Positive>
      <Positive>Clear "local/source ready" vs "production" distinction and instruction to re-run smoke after redeploy. "Do not treat local/source readiness as production readiness until post-redeploy production smoke checks pass."</Positive>
      <Observation>Index/landing page uses optimistic marketing language ("MCP live", "HUT evidence readiness", specific prices, "live Natural Language routes"). These are tempered by the requirement to check current MCP discovery / OpenAPI / llms files. This is acceptable for a public site but means agents must follow the "read llms-full.txt + OpenAPI first" discipline (which the docs themselves mandate).</Observation>
      <Observation>June 8 llms-full claims production hardening and some HUT issuer-evidence readiness behind x402, while retaining the "if discovery does not expose TripCode tools" guardrails. This is consistent with the trajectory noted in our prior local audit but remains externally dependent.</Observation>
    </Category>

    </Category>

    </Category>

    <Priority level="high">Continue the excellent practice of keeping llms-full.txt, changelog-llm (with tripcode river), and quickstart as the primary machine contracts. Consider adding a short "Current Public Discovery Snapshot" section or link that agents can poll (e.g., "last verified MCP tools/list signature" or "River blob status for key issuers").</Priority>
    <Priority level="high">Maintain (and possibly strengthen in the landing page hero/early sections) the discovery caveat language for TripCode/River and any "live" route claims. This is already done well in the llms and quickstart files.</Priority>
    <Priority level="medium">For the local deltasignal-ai-agent (the competition agent), ensure the submission packet / landing / future deltas cross-link to the latest llms-full.txt and this audit as supporting evidence of the backend service quality and shared evidence contract.</Priority>
    <Priority level="medium">Monitor the public MCP tools/list + River/index blob status for HUT (and other issuers) as the primary signal for when TripCode subscriber features can be safely marketed as publicly callable. The docs already treat this correctly as gated.</Priority>
    <Priority level="low">The Natural Language / StrategiX renderer layer (producing Markdown + finished PDFs) is a nice extension. If the local Go agent adds a path that surfaces these rendered briefs, document the renderer_mode / validation_status / fallback behavior in responses (the backend already does this well).</Priority>
