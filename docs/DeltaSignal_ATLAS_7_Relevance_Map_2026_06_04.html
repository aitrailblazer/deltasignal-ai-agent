<!doctype html>
<html lang="en">
<head>

  <style>

<body>
  <atlas-map></atlas-map>

  <script id="strategix-atlas-map-contract" type="application/xml">
<StrategiXVisualSpec version="1.0" status="public-source-map" generated="2026-06-04" artifact="docs/DeltaSignal_ATLAS_7_Relevance_Map_2026_06_04.html">

  <IntegrationBoundary>ATLAS-7 is an authorized existing integration/data source. The challenge project is the new autonomous agent in this repository, which may call or model ATLAS-7-style tools through bounded interfaces.</IntegrationBoundary>
  <RelevantCapabilities>
    <Capability>SEC / XBRL-grounded issuer intelligence for crypto-exposed public companies.</Capability>
    <Capability>Agent-native access through MCP, direct REST/OpenAPI, Arazzo workflow definitions, and x402-compatible public access.</Capability>

    <Capability>Composite workflows: Morning Brief, Company Report, Pressure Board, Alpha Sweep, Quick Ticker Check, and Peer Context.</Capability>
    <Capability>Granular tools: readiness, alpha signals, covenant stress, top-stressed ranking, peer ranking, risk distribution, company fundamentals, daily changes, and daily-change evidence.</Capability>

  <SubmissionUse>

    <Use>Use ATLAS-style tool envelopes in the new coordinator/specialist agent architecture.</Use>
    <Use>Demonstrate how an autonomous agent chooses bounded workflows rather than producing unconstrained market chatter.</Use>
    <Use>Preserve non-advice disclaimers, source-date inspection, caveats, and quality flags in the final brief.</Use>
  </SubmissionUse>
  <DemoMapping>
    <Lane name="readiness">Check service/data freshness and route readiness before analysis.</Lane>
    <Lane name="stress">Use top-stressed, covenant stress, and pressure-board style evidence.</Lane>
    <Lane name="issuer">Use company fundamentals, peer ranking, and alpha-signal style evidence for one ticker.</Lane>
    <Lane name="review">Surface source dates, caveats, quality flags, evidence hashes, and non-advice boundaries.</Lane>
  </DemoMapping>
  <RiskControls>
    <Risk>Do not imply the challenge repo newly built the existing ATLAS-7 service.</Risk>
    <Risk>Do not include live API keys, payment credentials, wallet data, or internal routes.</Risk>
    <Risk>Use deterministic fixtures when judge access to paid/private live routes is not available.</Risk>
    <Risk>Do not present issuer screens as personalized investment advice, price targets, or recommendations.</Risk>
  </RiskControls>
</StrategiXVisualSpec>

  <script type="module">
    import { LitElement, html, css } from 'https://unpkg.com/lit@3/index.js?module';

    const xml = document.getElementById('strategix-atlas-map-contract')?.textContent.trim() ?? '';

    const capabilities = [
      ['Evidence base', 'SEC / XBRL-grounded issuer intelligence for crypto-exposed public companies.'],
      ['Agent access', 'MCP, OpenAPI/REST, Arazzo workflows, Glama connector, and x402-compatible public access.'],
      ['Readiness', 'Service state, active data slice, freshness, issuer count, route/payment readiness, and caveats.'],
      ['Composite workflows', 'Morning Brief, Company Report, Pressure Board, Alpha Sweep, Quick Ticker Check, and Peer Context.'],
      ['Granular tools', 'Readiness, alpha signals, covenant stress, top-stressed, peer ranking, risk distribution, fundamentals, daily changes, and evidence drilldowns.'],
      ['Output contract', 'Structured JSON or evidence-preserving Markdown with provenance, caveats, and non-advice boundaries.']
    ];

    const demo = [
      ['Readiness lane', 'Check route/service/data freshness before making claims.'],
      ['Stress lane', 'Pull top-stressed, covenant stress, risk distribution, and pressure-board style evidence.'],
      ['Issuer lane', 'Pull fundamentals, alpha signals, peer ranking, and daily-change evidence for a ticker.'],
      ['Review lane', 'Inspect source dates, quality flags, stale markers, evidence hashes, and disclaimers.']
    ];

    class AtlasMap extends LitElement {
      static styles = css`
        :host {
          display: block;
          min-height: 100vh;
          background:
            radial-gradient(circle at 16% 0%, rgba(231,185,89,.18), transparent 32%),
            linear-gradient(180deg, #080a10 0%, #11131c 100%);
        }
        main { width: min(1180px, calc(100vw - 32px)); margin: 0 auto; padding: 34px 0 56px; }
        .hero { border: 1px solid rgba(231,185,89,.38); background: rgba(24,23,20,.88); border-radius: 10px; padding: 28px; box-shadow: 0 24px 72px rgba(0,0,0,.34); }
        .eyebrow { color: #e7b959; font-size: 12px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: 8px 0 10px; font-size: clamp(34px, 5.2vw, 62px); line-height: .98; letter-spacing: 0; }
        h2 { margin: 0 0 12px; color: #e7b959; font-size: 18px; letter-spacing: 0; }
        p { color: rgba(245,239,227,.78); margin: 0; }
        .panel, .card { border: 1px solid rgba(255,255,255,.1); background: rgba(18,20,31,.76); border-radius: 8px; padding: 16px; }
        .panel { margin-top: 16px; }
        .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
        .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .card b { display: block; color: #f5efe3; margin-bottom: 6px; }
        .card span, li { color: rgba(245,239,227,.72); font-size: 13px; }
        ul { margin: 0; padding-left: 20px; }
        li { margin: 7px 0; }
        pre { white-space: pre-wrap; overflow: auto; max-height: 420px; color: #e9ddc3; font-size: 12px; line-height: 1.45; margin: 0; }
        a { color: #e7b959; }
        @media (max-width: 900px) { .grid, .two { grid-template-columns: 1fr; } }
      `;

      render() {
        return html`
          <main>
            <section class="hero">
              <div class="eyebrow">Public Integration Map</div>
              <h1>DeltaSignal ATLAS-7 as the issuer-intelligence tool layer</h1>
              <p>Relevant facts from the public ATLAS-7 page and repository, mapped to the challenge submission as an authorized integration and data source rather than the new project itself.</p>
            </section>

            <section class="panel">
              <h2>Relevant Capabilities</h2>
              <div class="grid">
                ${capabilities.map(([k, v]) => html`<article class="card"><b>${k}</b><span>${v}</span></article>`)}
              </div>
            </section>

            <section class="panel">
              <h2>Demo Mapping</h2>
              <div class="grid two">
                ${demo.map(([k, v]) => html`<article class="card"><b>${k}</b><span>${v}</span></article>`)}
              </div>
            </section>

            <section class="panel">
              <h2>Use in Submission</h2>
              <ul>
                <li>Disclose ATLAS-7 as an existing integration/source of issuer-intelligence data.</li>
                <li>Use the new DeltaSignal AI Agent repository as the submitted project and orchestration layer.</li>
                <li>Show bounded workflows and evidence inspection instead of unconstrained market chat.</li>
                <li>Preserve caveats, quality flags, source dates, route/tool provenance, and non-advice boundaries.</li>
              </ul>
            </section>

            <section class="panel">
              <h2>Source References</h2>
              <ul>
                <li><a href="https://aitrailblazer.github.io/deltasignal-atlas-codex-plugin/">Delta Signal ATLAS-7 public page</a></li>
                <li><a href="https://github.com/aitrailblazer/deltasignal-atlas-codex-plugin">DeltaSignal ATLAS-7 Codex plugin repository</a></li>
                <li><a href="https://api.aitrailblazer.net/openapi.json">DeltaSignal ATLAS-7 OpenAPI contract</a></li>
                <li><a href="https://api.aitrailblazer.net/mcp">DeltaSignal ATLAS-7 MCP endpoint</a></li>
              </ul>
            </section>

            <section class="panel">
              <h2>Embedded XML Contract</h2>
              <pre>${xml}</pre>
            </section>
          </main>
        `;
      }
    }

    customElements.define('atlas-map', AtlasMap);
  </script>
