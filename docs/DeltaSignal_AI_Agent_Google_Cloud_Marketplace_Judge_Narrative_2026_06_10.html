  <Purpose>Present DeltaSignal Gemini AI Agent as a discoverable, callable, evidence-bounded financial intelligence agent for Google Cloud Marketplace. The narrative explains how TripCodes, River memory, ATLAS-7 evidence, Gemini synthesis, A2A discovery, protected task execution, MCP-style workflows, OpenAPI contracts, Arazzo plans, and x402-aware access combine into a reusable enterprise agent surface.</Purpose>

  <CorePositioning>
    <Claim>DeltaSignal is positioned for Google Cloud Marketplace as specialist agent infrastructure, not a generic filing chatbot.</Claim>
    <Primitive>The product primitive is the TripCode/River research handle: one stable identifier resolves article memory, issuer continuity, SEC/XBRL evidence references, ATLAS-7 ticker intelligence, thesis deltas, caveats, telemetry, usage context, and non-advice boundaries.</Primitive>
    <MarketplaceValue>Another enterprise agent can discover DeltaSignal, invoke a bounded research workflow, receive a structured evidence packet, inspect provenance, preserve session continuity, and route the result into portfolio, compliance, data-room, subscriber, or diligence workflows.</MarketplaceValue>
  </CorePositioning>

  <BuildNarrative>
    <Headline>Build: agent-native evidence pipeline</Headline>
    <Point>DeltaSignal is built as an agent-native evidence pipeline rather than a general financial chat surface.</Point>
    <Point>The agent exposes a marketplace-facing capability surface through an Agent Card, A2A skill contract, MCP-style tool contracts, OpenAPI routes, Arazzo workflow plans, and bounded composite workflows.</Point>
    <Point>Representative bounded workflows include Morning Brief, Company Report, Pressure Board, Alpha Sweep, and Quick Ticker Check.</Point>
    <Point>The build layer starts with SEC/XBRL evidence. EDGAR Company Facts data flows into the ATLAS-7 issuer pipeline, where crypto-exposed public companies are normalized into structured evidence rows, issuer histories, stress signals, peer context, alpha signals, daily changes, caveats, quality flags, source dates, and evidence metadata.</Point>
    <Point>Gemini acts as the synthesis layer. It compiles returned DeltaSignal evidence into readable diligence packets while preserving source dates, stale flags, caveats, payload mode, route provenance, and non-advice boundaries.</Point>
    <JudgeClaim>DeltaSignal turns filing-backed issuer intelligence into callable agent skills with explicit contracts, structured outputs, and verifier-ready metadata.</JudgeClaim>
  </BuildNarrative>

  <ScaleNarrative>
    <Headline>Scale: reusable enterprise agent workflows</Headline>
    <Point>DeltaSignal is designed to scale from a single prompt into repeatable enterprise workflows.</Point>
    <Point>The same loop can serve a human analyst, portfolio agent, compliance agent, data-room agent, subscriber copilot, or enterprise diligence orchestrator.</Point>
    <Point>A caller supplies a TripCode, issuer, ticker, or monitoring intent. DeltaSignal resolves the relevant River state, selects a bounded workflow, calls protected evidence surfaces, assembles the packet, synthesizes the brief, verifies boundaries, writes continuity state, and returns either an A2A task artifact or a monitor-next baseline.</Point>
    <GoogleCloudMapping>
      <Layer name="Cloud Run">Hosted execution for callable agent routes.</Layer>
      <Layer name="Agent Runtime patterns">Long-running agent workflow path outside a local operator session.</Layer>
      <Layer name="Sessions">Same-conversation continuity.</Layer>
      <Layer name="Memory Bank">Durable River memory across sessions.</Layer>
      <Layer name="MCP, REST, OpenAPI, Arazzo, Glama, and x402-compatible access">Different clients can consume the same evidence surface without bespoke integration.</Layer>
    </GoogleCloudMapping>
    <JudgeClaim>The agent is inspectable before execution, useful on the first call, and reusable across downstream enterprise workflows.</JudgeClaim>
  </ScaleNarrative>

  <GovernNarrative>
    <Headline>Govern: bounded evidence and protected execution</Headline>
    <Point>DeltaSignal separates memory from evidence. TripCodes and River nodes provide continuity and resolver metadata; SEC accessions, filing dates, filing periods, XBRL concepts, source documents, hashes, and ATLAS-7 evidence outputs remain the evidence anchors.</Point>
    <Point>Same-session memory can guide continuity, but it does not become proof.</Point>
    <GovernanceControls>
      <Control>Protected A2A execution through secured routes.</Control>
      <Control>Secret Manager for credentials and protected service access.</Control>
      <Control>Agent Identity, Agent Gateway, and Agent Registry patterns for enterprise discovery and controlled invocation.</Control>
      <Control>Evidence gates that prevent inference from being upgraded into evidence.</Control>
      <Control>Freshness gates that surface stale or missing data.</Control>
      <Control>Memory gates that keep River continuity separate from source proof.</Control>
      <Control>Cost gates that record usage estimates while preserving billing boundaries.</Control>
      <Control>Safety gates that require caveats, missing-data disclosure, and non-advice language.</Control>
      <Control>Escalation gates that degrade gracefully when API keys, evidence sources, rate limits, or MCP access block a live check.</Control>
    </GovernanceControls>
    <JudgeClaim>DeltaSignal does not ask users to trust generated prose. It asks users and downstream agents to inspect the evidence packet, metadata, caveats, and verifier boundaries before relying on the narrative.</JudgeClaim>
  </GovernNarrative>

  <OptimizeNarrative>
    <Headline>Optimize: observable production loops</Headline>
    <Point>DeltaSignal optimizes through observability, telemetry, evaluation, and repeatable production loops.</Point>
    <Point>Each run can record execution trace, runtime labels, route provenance, structured logs, usage estimate, latency, payload mode, and evidence-fidelity status.</Point>
    <Point>These signals map naturally to Cloud Logging, Cloud Monitoring, Cloud Trace, and Agent Evaluation.</Point>
    <EvaluationFocus>The agent can evaluate whether the research packet preserved source binding, disclosed stale evidence, surfaced missing data, maintained non-advice posture, stayed within budget, and returned a usable monitor-next baseline.</EvaluationFocus>
    <JudgeClaim>DeltaSignal's production loop can be tested, traced, improved, and re-run. It behaves like enterprise agent infrastructure, not a one-off demo.</JudgeClaim>
  </OptimizeNarrative>

    <Headline>Production Loop</Headline>
    <Step order="1" name="Trigger">TripCode, issuer, ticker, or monitor request.</Step>
    <Step order="2" name="Discover">Caller inspects the Agent Card and skill contract.</Step>
    <Step order="3" name="Plan">A bounded workflow is selected.</Step>
    <Step order="4" name="Execute">Protected resolver and evidence surfaces are called.</Step>
    <Step order="5" name="Assemble">Article memory, River continuity, SEC/XBRL references, caveats, hashes, dates, and telemetry are packaged.</Step>
    <Step order="6" name="Synthesize">Gemini creates the analyst-readable brief from bounded evidence.</Step>
    <Step order="7" name="Verify">Evidence, freshness, safety, memory, and cost gates are checked.</Step>
    <Step order="8" name="Remember">Session and River continuity are preserved.</Step>
    <Step order="9" name="Observe">Trace, logs, usage, latency, and evidence fidelity are recorded.</Step>
    <Step order="10" name="Return or monitor">The agent returns a task artifact or schedules the next thesis check.</Step>
  </ProductionLoop>

    <Headline>Production loop engineering for financial research agents</Headline>

    <Point>DeltaSignal applies the same loop to issuer diligence: TripCodes, River memory, SEC/XBRL evidence, ATLAS-7 outputs, Gemini synthesis, verifier boundaries, telemetry, and monitor-next actions.</Point>
    <JudgeClaim>The Marketplace value is that other agents can discover DeltaSignal, call it for bounded issuer intelligence, inspect provenance, route the output into enterprise workflows, and reuse the research state over time.</JudgeClaim>
  </MarketplacePositioning>

  <EvidenceBoundary>
    <Boundary>TripCodes are resolver handles and research-memory anchors, not official SEC identifiers.</Boundary>
    <Boundary>SEC/XBRL identifiers, accessions, filing dates, filing periods, concepts, source documents, hashes, and source dates remain the evidence anchors.</Boundary>
    <Boundary>Gemini synthesis is a compression layer over bounded evidence, not a replacement for evidence.</Boundary>
    <Boundary>DeltaSignal outputs are evidence-routing alerts and diligence triage only. They are not investment advice, recommendations, price targets, or order instructions.</Boundary>
  </EvidenceBoundary>
