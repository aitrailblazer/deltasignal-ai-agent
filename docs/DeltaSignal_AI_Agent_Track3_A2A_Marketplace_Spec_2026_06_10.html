  <Purpose>Show the Track 3 functionality of DeltaSignal Gemini AI Agent: a discoverable, callable, evidence-bounded specialist agent that other enterprise agents can use. The core product primitive is TripCode/River memory: one stable research handle resolves article memory, issuer River continuity, ATLAS-7 ticker and SEC/XBRL evidence references, thesis deltas, monitor-next items, caveats, telemetry, and non-advice boundaries.</Purpose>

  <StrategicThesis>Track 1 proves DeltaSignal works as an autonomous agent. Track 3 frames DeltaSignal as infrastructure inside a broader agent ecosystem. Many entries can show a working agent. Fewer can describe a production-grade agent surface that another agent can discover, invoke, verify, and reuse. DeltaSignal's core primitive is a stable TripCode resolver handle joined to River-based research memory, MCP-bounded evidence retrieval, Gemini synthesis, session continuity, telemetry, cost visibility, non-advice boundaries, public A2A discovery routes, and protected task execution.</StrategicThesis>

  <FinalJudgeNarrative>
    <CorePositioning>
      <Claim>DeltaSignal Gemini AI Agent is positioned for Google Cloud Marketplace as a discoverable, callable, evidence-bounded financial intelligence agent.</Claim>
      <Clarification>The Track 3 move is not simply an agent that answers questions. It is a production agent surface that another enterprise agent can discover, invoke, verify, reuse, and monitor.</Clarification>
      <Primitive>The product primitive is the TripCode/River research handle: one stable research identifier resolves article memory, issuer continuity, SEC/XBRL evidence references, ATLAS-7 ticker intelligence, thesis deltas, caveats, telemetry, and non-advice boundaries.</Primitive>
      <MarketplaceValue>DeltaSignal becomes specialist agent infrastructure for portfolio agents, compliance agents, data-room agents, subscriber copilots, and diligence workflows.</MarketplaceValue>
    </CorePositioning>
    <Build>
      <Headline>Build: agent-native evidence pipeline</Headline>
      <Point>DeltaSignal is built as an agent-native evidence pipeline, not a generic financial chatbot.</Point>
      <Point>The agent exposes a marketplace-facing capability surface through an Agent Card, A2A skill contract, MCP-style tool contracts, OpenAPI routes, Arazzo workflow plans, and bounded composite workflows.</Point>
      <Point>Bounded workflows include Morning Brief, Company Report, Pressure Board, Alpha Sweep, and Quick Ticker Check.</Point>
      <Point>The build layer starts with SEC/XBRL evidence. EDGAR Company Facts data flows into the ATLAS-7 issuer pipeline, where crypto-exposed public companies are normalized into evidence rows, issuer histories, stress signals, peer context, alpha signals, daily changes, caveats, quality flags, source dates, and evidence metadata.</Point>
      <Point>Gemini acts as the synthesis layer. It compiles returned DeltaSignal evidence into readable diligence packets while preserving source dates, stale flags, caveats, payload mode, route provenance, and non-advice boundaries.</Point>
      <JudgeClaim>DeltaSignal turns filing-backed issuer intelligence into callable agent skills with explicit contracts, structured outputs, and verifier-ready metadata.</JudgeClaim>
    </Build>
    <Scale>
      <Headline>Scale: reusable enterprise agent workflows</Headline>
      <Point>The same production loop can serve a human analyst, portfolio agent, compliance agent, data-room agent, subscriber copilot, or enterprise diligence orchestrator.</Point>
      <Point>A caller supplies a TripCode, issuer, ticker, or monitoring intent. DeltaSignal resolves the relevant River state, selects the bounded workflow, calls protected evidence surfaces, assembles the packet, synthesizes the brief, verifies boundaries, writes continuity state, and returns either an A2A task artifact or a monitor-next baseline.</Point>
      <GoogleCloudMapping>Cloud Run supports hosted execution for callable routes. Agent Runtime patterns support long-running agent workflows. Sessions preserve same-conversation continuity. Memory Bank maps to durable River memory. MCP, REST, OpenAPI, Arazzo, Glama, and x402-compatible access paths let different clients consume the same evidence surface without bespoke integration.</GoogleCloudMapping>
      <JudgeClaim>The agent is inspectable before execution, useful on the first call, and reusable across downstream enterprise workflows.</JudgeClaim>
    </Scale>
    <Govern>
      <Headline>Govern: bounded evidence and protected execution</Headline>
      <Point>The agent separates memory from evidence. TripCodes and River nodes provide continuity and resolver metadata; SEC accessions, filings, concepts, source documents, hashes, dates, and ATLAS-7 outputs remain evidence anchors.</Point>
      <Point>Same-session memory can guide continuity, but it does not become proof.</Point>
      <Control>Protected A2A execution through secured routes.</Control>
      <Control>Secret Manager for credentials and protected service access.</Control>
      <Control>Agent Identity, Agent Gateway, and Agent Registry patterns for enterprise discovery and controlled invocation.</Control>
      <Control>Evidence gates that prevent inference from being upgraded into evidence.</Control>
      <Control>Freshness gates that surface stale or missing data.</Control>
      <Control>Memory gates that keep River continuity separate from source proof.</Control>
      <Control>Cost gates that record usage estimates while preserving billing boundaries.</Control>
      <Control>Safety gates that require caveats, missing-data disclosure, and non-advice language.</Control>
      <Control>Escalation gates that degrade gracefully when API keys, MCP access, evidence sources, or rate limits block a live check.</Control>
      <JudgeClaim>DeltaSignal does not ask users to trust generated prose. It asks users and downstream agents to inspect the evidence packet, metadata, caveats, and verifier boundaries before relying on the narrative.</JudgeClaim>
    </Govern>
    <Optimize>
      <Headline>Optimize: observable production loops</Headline>
      <Point>DeltaSignal optimizes through observability, telemetry, evaluation, and repeatable production loops.</Point>
      <Point>Each run can record execution trace, runtime labels, route provenance, structured logs, usage estimate, latency, payload mode, and evidence-fidelity status.</Point>
      <Point>These signals map naturally to Cloud Logging, Cloud Monitoring, Cloud Trace, and Agent Evaluation.</Point>
      <EvaluationFocus>The agent can evaluate whether the research packet preserved source binding, disclosed stale evidence, surfaced missing data, maintained non-advice posture, stayed within budget, and returned a usable monitor-next baseline.</EvaluationFocus>
      <JudgeClaim>DeltaSignal's production loop can be tested, traced, improved, and re-run. It behaves like enterprise agent infrastructure, not a one-off demo.</JudgeClaim>
    </Optimize>
    <MarketplacePositioning>
      <Point>DeltaSignal transfers production loop engineering from coding-agent systems into financial research agents.</Point>
      <Point>A coding agent reads repository context, decomposes work, calls tools, creates artifacts, runs tests, records evidence, and preserves memory. DeltaSignal applies the same loop to issuer diligence: TripCodes, River memory, SEC/XBRL evidence, ATLAS-7 outputs, Gemini synthesis, verifier boundaries, telemetry, and monitor-next actions.</Point>
      <JudgeClaim>The Marketplace value is that other agents can discover DeltaSignal, call it for bounded issuer intelligence, inspect provenance, route the output into portfolio or compliance workflows, and reuse the research state over time.</JudgeClaim>
    </MarketplacePositioning>

  <LoopEngineeringReframing>
    <StandardPattern>Loop engineering is familiar from coding-agent systems: a developer gives an objective, the agent reads repository context, decomposes work, calls tools, creates artifacts, runs tests, records evidence, preserves memory, and routes the result through verification.</StandardPattern>
    <DeltaSignalInversion>DeltaSignal keeps that original coding-loop idea intact, then transfers it into the production financial agent. Instead of code tasks, the loop operates on TripCodes, issuer Rivers, SEC/XBRL evidence, MCP tool calls, Gemini synthesis, verifier boundaries, session memory, and monitor-next actions.</DeltaSignalInversion>
    <ProductionLoop>A TripCode or issuer objective starts the loop. The agent resolves article memory and River state. MCP retrieves bounded evidence. Gemini synthesizes the diligence packet. A verifier boundary checks evidence, caveats, missing data, memory integrity, cost, and non-advice posture. Session memory preserves continuity. Monitor-next items define the next production cycle.</ProductionLoop>
    <Track3Message>The competition idea is the transfer: loop engineering is used for coding, and DeltaSignal uses the same pattern for the production research agent.</Track3Message>
  </LoopEngineeringReframing>

  <ProductionLoopEngineeringConcept>
    <Definition>Production loop engineering is the design of a closed agent-control loop that can run outside a local operator session: objective intake, capability discovery, plan selection, tool execution, evidence assembly, synthesis, verification, memory update, observability capture, cost accounting, and monitor-next scheduling.</Definition>
    <WhyItMatters>A chatbot answers the current question. A production loop keeps a research state alive. DeltaSignal uses the loop to make a published financial thesis executable, revisitable, auditable, and callable by other agents.</WhyItMatters>
    <GooglePlatformMapping>
      <Layer name="Build">Agent Card, A2A skill contract, MCP-style tool contracts, ATLAS-7 evidence workflows, and Gemini synthesis define what the agent can do.</Layer>
      <Layer name="Scale">Cloud Run and Agent Runtime patterns provide hosted execution; Sessions preserve same-conversation context; Memory Bank maps to durable River memory across sessions.</Layer>
      <Layer name="Govern">Protected /a2a access, Secret Manager, non-advice boundaries, evidence separation, Agent Identity, Agent Gateway, and Agent Registry map the loop to enterprise governance.</Layer>
      <Layer name="Optimize">execution_trace, structured logs, usage telemetry, evidence_fidelity, Cloud Logging, Cloud Monitoring, Cloud Trace, and Agent Evaluation show how the loop is tested and improved.</Layer>
    </GooglePlatformMapping>
    <LoopStages>
      <Stage order="1" name="Trigger">A user, portfolio agent, compliance agent, data-room agent, or subscriber agent supplies a TripCode, issuer, ticker, or monitoring intent.</Stage>
      <Stage order="2" name="Discover">The calling agent can inspect the public Agent Card and skill contract before invoking DeltaSignal.</Stage>
      <Stage order="3" name="Plan">DeltaSignal selects the bounded workflow: resolve TripCode, load River, call ATLAS-7 ticker/company-report evidence, compare thesis state, or run monitor-next checks.</Stage>
      <Stage order="4" name="Execute tools">The agent calls protected resolver and evidence surfaces rather than inventing facts from the model context.</Stage>
      <Stage order="5" name="Assemble evidence">The packet separates article memory, River continuity, SEC/XBRL references, issuer/ticker metadata, caveats, missing evidence, source dates, hashes, and payload mode.</Stage>
      <Stage order="6" name="Synthesize">Gemini compresses the bounded packet into analyst-readable output while preserving provenance and non-advice constraints.</Stage>
      <Stage order="7" name="Verify">A separate verifier boundary checks source binding, stale flags, missing-data disclosure, quality flags, memory integrity, budget, usage, and non-advice posture.</Stage>
      <Stage order="8" name="Remember">The same-session River state is preserved by session_id; Memory Bank backing turns resolved Rivers into durable cross-session research memory.</Stage>
      <Stage order="9" name="Observe">The run records execution_trace, runtime labels, route provenance, structured logs, usage estimate, latency, and evidence_fidelity status.</Stage>
      <Stage order="10" name="Return or monitor">The loop returns a completed A2A task artifact, subscriber packet, or monitor-next baseline for the next scheduled evidence check.</Stage>
    </LoopStages>
    <ControlGates>
      <Gate name="Evidence gate">Do not upgrade inference into evidence. TripCodes and River nodes are resolver metadata; SEC accessions, filings, concepts, source documents, hashes, and dates remain evidence anchors.</Gate>
      <Gate name="Freshness gate">Mark stale or missing evidence instead of smoothing it over.</Gate>
      <Gate name="Memory gate">Do not treat same-session memory as evidence. Memory is continuity, not source proof.</Gate>
      <Gate name="Cost gate">Record local-estimate usage and preserve the official-billing boundary.</Gate>
      <Gate name="Safety gate">Return non-advice language, caveats, and missing-data boundaries before a packet can be treated as complete.</Gate>
      <Gate name="Escalation gate">Pause or degrade gracefully when API keys, MCP access, evidence sources, or rate limits block a live check.</Gate>
    </ControlGates>
    <MarketplaceFunctionality>For Track 3, the production loop is the product. Other agents do not need hidden implementation knowledge. They discover the Agent Card, call a skill, receive a structured research packet, inspect provenance and boundaries, and decide whether to route the output into portfolio, compliance, diligence, data-room, or subscriber workflows.</MarketplaceFunctionality>
  </ProductionLoopEngineeringConcept>

  <ProductionLoopArchitecture>
    <Seed>A TripCode, issuer, or external-agent task request.</Seed>
    <Memory>Compact River continuity stored by session_id; durable River memory can back portfolio, compliance, diligence, data-room, and subscriber workflows.</Memory>
    <Tools>MCP-compatible DeltaSignal ATLAS-7 evidence surface, TripCode resolver, ticker/company report workflows, SEC/XBRL evidence references, Gemini synthesis, usage telemetry, and A2A task endpoint.</Tools>
