  <ResearchMemoryExtension status="product-expansion">
    <Summary>The same agent architecture turns the DeltaSignal Substack archive into a subscriber research memory system using TripCodes, article Rivers, and filing evidence.</Summary>
    <TripCodeRole>Each article can expose a stable TripCode that resolves to a machine-readable research object with title, thesis, tickers, linked evidence, caveats, prior nodes, and related River membership.</TripCodeRole>
    <RiverRole>Rivers group related articles into ordered thesis trails so subscribers can ask what changed across a ticker, theme, or thesis over time.</RiverRole>
    <SessionMemoryRole>For the competition Go service, a session_id stores compact River continuity memory: last TripCode, issuer, article title, packet keys, River count, monitor hints, and weakened-assumption hints.</SessionMemoryRole>
    <SubscriberWorkflow>Subscriber opens an article, reads the TripCode, asks the agent to resolve it, and receives the prior River, thesis evolution, filing confirmations, weakened assumptions, and next monitoring checklist.</SubscriberWorkflow>
    <EvidenceBoundary>Article memory remains separate from SEC/XBRL evidence. The agent must label article-derived claims, filing-backed claims, MCP evidence, inference, and missing data.</EvidenceBoundary>
    <CompetitionClaim>TripCodes make financial research portable, inspectable, and executable by agents.</CompetitionClaim>
    <CompositeToolClaim>deltasignal_resolve_tripcode_research_packet is the precise resolver layer: one TripCode returns a research_packet with article memory, River continuity, evidence refs, thesis evolution, missing evidence, and article-memory/evidence/identity/non-advice boundaries.</CompositeToolClaim>
    <HUTProof>TF-SUB-9DA70A7F98 resolved the Hut 8 article, recovered 9 prior HUT article nodes plus the current node, built a 10-node River, and returned changed findings, confirmed signal, weakened assumptions, execution bridge risks, proof milestones, invalidation logic, monitor-next items, and scenario framing.</HUTProof>
    <Moat>Newsletter archives are passive. Research memory is active: it lets agents reconstruct what the author believed, what changed, what evidence supports it, and what still needs proof.</Moat>
  </ResearchMemoryExtension>

  <JudgeNarrative>
    <Opening>DeltaSignal is not another filing chatbot or generic deep-research wrapper. It turns proprietary financial research into executable agent memory. One TripCode resolves a published article into a machine-readable research packet, reconstructs the prior thesis River, compares that thesis against SEC/XBRL-backed evidence, and returns what changed, what weakened, what remains unproven, and what to monitor next with provenance, uncertainty, and non-advice boundaries preserved.</Opening>
    <RuntimeAutonomy>The submitted agent performs the runtime research workflow autonomously after the user provides one TripCode or issuer prompt. DeltaSignal Gemini AI Agent is the runtime product agent judges can call.</RuntimeAutonomy>
    <TrackOne title="Track 1 - Build: A Working Agent, Not a Slideware Concept">The submitted system is a Go-native Cloud Run agent built for judge-safe reproducibility and live integration. It exposes health, brief-generation, usage, TripCode, and judge shortcut routes; supports deterministic demo fixtures; and runs the live DeltaSignal ATLAS-7 MCP mode when the proper API key is supplied. The core build is an autonomous TripCode workflow: a stable article code becomes an executable research object with article memory, River continuity, filing references, thesis evolution, missing evidence, caveats, and monitor-next items. The agent moves beyond reporting by resolving the handle, calling external tools through MCP, reconstructing state, comparing evidence, preserving session memory, and returning a diligence packet. The HUT proof case demonstrates this workflow concretely through TF-SUB-9DA70A7F98, which resolves the Hut 8 article, reconstructs a 10-node HUT River, and returns changed findings, weakened assumptions, confirmed signals, execution bridge risks, proof milestones, invalidation logic, scenario framing, and a monitoring checklist.</TrackOne>
    <TrackTwo title="Track 2 - Optimize: Grounded, Auditable, Cost-Controlled">The system is optimized around judge trust: deterministic fallback mode, live MCP mode behind explicit configuration, Gemini synthesis through Vertex AI, bounded session memory, protected demo access, local-estimate usage tracking, runtime telemetry, structured logs, and configurable rate limits. The audit reports 100 percent test coverage, clean go vet, no discovered secrets or credentials, correct ignore rules, distroless nonroot deployment posture, and clean separation between demo, live MCP, and Gemini paths. The strongest optimization is evidence discipline: the agent separates article-derived claims, filing-backed claims, MCP evidence, inference, missing data, identity boundaries, and non-advice language. The evidence-fidelity increment surfaces an evidence_fidelity summary through /v1/brief and the Gemini prompt path, while the runtime-hardening increment exposes request_id, trace_id, duration, rate-limit state, and memory backend status through every protected response.</TrackTwo>
    <TrackThree title="Track 3 - Path: From Research Agent to Agent Network">DeltaSignal's path is larger than a single demo. TripCodes create stable handles for proprietary research memory. Rivers organize articles into evolving thesis trails. ATLAS-7 provides the evidence layer. Gemini supplies synthesis. MCP provides the evidence interface. The first Track 3 slice now exposes A2A agent-card discovery and a protected /a2a task endpoint so other agents can discover and invoke the TripCode research-packet workflow while preserving provenance and boundaries.</TrackThree>
    <WhyThisWins>Generic agents answer questions; DeltaSignal preserves a research lineage. Filing agents compare documents; DeltaSignal reconciles prior thesis claims against newer evidence. Search systems find content; DeltaSignal makes the content executable by agents.</WhyThisWins>
    <JudgeClose>DeltaSignal's competition advantage is simple: one TripCode converts a passive research archive into an auditable, agent-executable diligence workflow. The demo proves build readiness, the audit proves engineering discipline, and the architecture shows a credible path from single-agent resolution to multi-agent financial research infrastructure.</JudgeClose>
    <EvidenceBoundary>This narrative uses the visible audit, submission packet, and evaluation excerpts. The attached items reported zero linked drilldowns; exact omitted deployment details or full styleguide recommendations would require a narrower drilldown into those artifacts.</EvidenceBoundary>
  </JudgeNarrative>
