  <AutonomousLoopSpec status="competition-reliability-contract">
    <Purpose>Run an autonomous, evidence-bounded research loop that turns a user intent, TripCode, ticker, or monitoring backlog item into a verified DeltaSignal diligence packet with preserved provenance, session memory, cost telemetry, and explicit stop conditions.</Purpose>
    <Invariant>The agent that produces the output never verifies its own work.</Invariant>
    <Inputs required="run_id session_id intent workflow_type evidence_mode budget output_contract">Required inputs include run_id, session_id, intent, workflow_type, evidence_mode, budget, and output_contract. Optional inputs include ticker, TripCode, watchlist, article_id, river_id, requested_depth, style, and delivery_target.</Inputs>
    <WorkflowTypes>tripcode_research_packet, morning_brief, company_report, pressure_board, alpha_sweep, quick_ticker_check, daily_change_drilldown, and code_quality_loop.</WorkflowTypes>
    <OutputContract>Non-advisory financial diligence; evidence-bound claims only; missing data remains missing; source dates and caveats preserved; no invented filings, links, prices, tickers, route names, tool outputs, or accession numbers.</OutputContract>
    <Agent name="Heartbeat">Starts the loop on cron schedule, user request, CI failure, new filing evidence, new TripCode, monitoring backlog item, or manual judge-demo run. It may stop immediately when required input is missing or budget is zero.</Agent>
    <Agent name="Coordinator">Classifies workflow, selects tools/connectors, assigns specialists, enforces maker/checker separation, writes initial run state, and prevents specialists from expanding scope without approval.</Agent>
    <Agent name="Discovery / Triage">Ranks candidate work from issues, CI failures, recent commits, daily changes, TripCode backlog, issuer watchlist, prior River monitor queue, and attached context. It prefers composite workflows first.</Agent>
    <Agent name="Evidence Collector">Fetches or reads bounded evidence from ATLAS-7 MCP/REST, readiness, daily changes, fundamentals, covenant stress, peer ranking, SPECTRA maps, TripCode/River tools when exposed, and attached readable context. Missing or unavailable evidence must remain missing.</Agent>
    <Agent name="River Memory">Resolves continuity across TripCode, thesis evolution, issuer River, monitor-next queue, follow-up sessions, and compact session snapshots. Memory is context, not evidence.</Agent>
    <Agent name="Maker">Drafts the answer, code patch, report, or diligence packet. It separates facts, inference, and missing evidence, includes confidence and uncertainty, and avoids investment advice. It may not grade its own work.</Agent>
    <Agent name="Verifier">Adversarially checks Maker output against evidence, provenance completeness, stop conditions, non-advice boundaries, missing-data disclosure, budget, telemetry, and memory validity. If Verifier fails, the loop cannot mark complete.</Agent>
    <Agent name="Publisher / Notifier">Emits the final chat response, report, judge route, PR comment, ticket, Slack notification, or archive artifact only after verification passes.</Agent>
    <ExecutionStep order="1" name="Start">Heartbeat creates run_id, loads session_id, applies budget, and sends intent to Coordinator.</ExecutionStep>
    <ExecutionStep order="2" name="Plan">Coordinator selects workflow and task graph: TripCode routes to tripcode_research_packet, ticker diligence routes to company_report, market-wide requests route to morning_brief or pressure_board, changed evidence routes to daily_change_drilldown, and repo failure routes to code_quality_loop.</ExecutionStep>
    <ExecutionStep order="3" name="Discover">Discovery ranks work items and records findings in durable memory.</ExecutionStep>
    <ExecutionStep order="4" name="Collect Evidence">Evidence Collector fetches only evidence required by workflow. Morning Brief uses readiness, daily changes, risk distribution, top stressed, and alpha opportunities. Company Report uses fundamentals, covenant stress, peer ranking, alpha signals, and SPECTRA when available. TripCode research uses TripCode/River tools only when live discovery exposes them.</ExecutionStep>
    <ExecutionStep order="5" name="Reconstruct Memory">River Memory loads prior session or River state and maps prior claims, thesis changes, filing-backed evidence, caveats, and monitor-next items.</ExecutionStep>
    <ExecutionStep order="6" name="Draft">Maker generates the diligence packet or code change.</ExecutionStep>
    <ExecutionStep order="7" name="Verify">Verifier checks the draft against evidence and stop conditions.</ExecutionStep>
    <ExecutionStep order="8" name="Revise Or Stop">If verification fails and budget remains, return to Maker or Evidence Collector. If verification passes, publish. If a hard stop is hit, pause or escalate.</ExecutionStep>
    <SuccessStop>The loop may complete only when selected workflow executed or attached evidence was fully processed, required evidence is present or missing evidence is disclosed, metadata and caveats are preserved, Maker output separates facts/inference/open questions, Verifier passes hard checks, memory and telemetry are written, and output remains non-advisory.</SuccessStop>
    <PauseStop>Pause for human input when TripCode/River tools are not exposed by live discovery, source evidence is restricted, second-level drilldown is required, x402 grant blocks execution, issuer identity is ambiguous, budget is nearly exhausted, or verifier requests human judgment.</PauseStop>
    <FailureStop>Fail when max iterations, max cost, max tool calls, repeated verifier failure, output-contract contradiction, secret exposure, invented material evidence, non-advice violation, or unrepaired code test failure occurs.</FailureStop>
    <EscalationStop>Escalate when evidence conflicts materially, current evidence contradicts memory, filing data is stale/incomplete, output would influence financial decisions without enough evidence, or verifier cannot determine completion.</EscalationStop>
  </AutonomousLoopSpec>

  <ADKProductLoopOperatingSystem status="production-architecture">
    <CoreWorkflow>Model the product as a looped agent operating system, not a single chat agent: scheduled scan, triage, planner, isolated execution, verifier, publisher, memory write, and human approval for high-risk actions.</CoreWorkflow>
    <RootAgent name="Product Loop Orchestrator">Owns loop state, reads memory, triggers discovery, routes tasks to specialized agents, enforces stop conditions, and escalates uncertain or high-risk work to human review.</RootAgent>
    <WorkflowAgents>Use ADK workflow agents for predictable stages: sequential pipelines for ordered work, parallel agents for independent scans, and loop agents for repeated goal-seeking cycles. Use adaptive LLM routing only where the route is genuinely ambiguous.</WorkflowAgents>
    <SpecializedAgent name="Discovery Agent">Finds work from issues, CI failures, recent commits, feedback, production logs, support tickets, roadmap docs, ATLAS-7 evidence changes, TripCode monitor queues, and issuer Rivers.</SpecializedAgent>
    <SpecializedAgent name="Triage Agent">Deduplicates findings, ranks them by customer impact, revenue impact, security risk, regression risk, evidence strength, and effort, then promotes executable findings to planning or sends low-confidence items to human review.</SpecializedAgent>
    <SpecializedAgent name="Planner Agent">Converts each finding into a constrained task spec with goal, evidence, affected systems, acceptance criteria, required tools, risk level, verifier checklist, and human-approval requirement.</SpecializedAgent>
    <SpecializedAgent name="Builder Agent">Executes one task in an isolated branch, worktree, artifact directory, and task-scoped credential boundary. Builder has no merge, deploy, or publish authority.</SpecializedAgent>
    <SpecializedAgent name="Verifier Agent">Checks tests, lint, typecheck, diff scope, acceptance criteria, secret leakage, evidence binding, product policy, renderer contracts, and final-output quality. Maker and checker are separate.</SpecializedAgent>
    <SpecializedAgent name="Publisher Agent">Only after verification passes, opens PRs, updates tickets, writes changelog entries, creates artifacts, posts summaries, or marks loop memory complete or blocked.</SpecializedAgent>
    <ToolLayer>
      <ToolClass name="Repo And Build Tools">read_repo, write_patch, create_worktree, run_tests, run_lint, run_typecheck, inspect_diff, open_pr.</ToolClass>
      <ToolClass name="Product Ops Tools">read_issues, update_ticket, read_ci, post_summary, create_release_note, query_customer_feedback.</ToolClass>
      <ToolClass name="Grounding Tools">search_docs, search_memory, retrieve_artifact, query_database_readonly, search_web_with_grounding only for facts outside the controlled corpus.</ToolClass>
      <ToolClass name="Governance Tools">policy_check, secret_scan, license_check, eval_trace, human_approval_request.</ToolClass>
    </ToolLayer>
    <MemoryArchitecture>
      <Layer name="Session State">Current run, active agent, tool calls, pending approvals, temporary artifacts, and acceptance criteria.</Layer>
      <Layer name="Durable Loop Memory">loop_runs, findings, tasks, agent_actions, verification_records, human_decisions, artifact_refs, blocked_items, and known_project_conventions.</Layer>
      <Layer name="Product Knowledge Memory">Versioned product skills and policy documents for architecture, code style, release policy, security policy, renderer contracts, DeltaSignal report rules, and MCP tool policy.</Layer>
    </MemoryArchitecture>
    <GroundingStrategy>
      <Layer name="Source Of Truth Grounding">Repo, tests, DB schema, API contracts, design docs, product specs, tickets, and prior verification records.</Layer>
      <Layer name="Memory Grounding">Prior loop attempts, known failed fixes, recurring regressions, conventions, reviewer decisions, and customer-impact history.</Layer>
      <Layer name="External Grounding">Dependency docs, vendor APIs, security advisories, platform documentation, and current web facts only when they are outside the internal corpus.</Layer>
    </GroundingStrategy>
    <DeploymentPhases>
      <Phase name="Phase 1 Local Dev Harness">Manual trigger, local runner, isolated temp branches, no direct PR or deploy authority, and success measured by useful triage, constrained diffs, verifier catches, and accurate memory.</Phase>
      <Phase name="Phase 2 Cloud Run Background Worker">Scheduled loop execution, durable DB memory, artifact storage, task-scoped connectors, and human approval before merge, deploy, or publication.</Phase>
      <Phase name="Phase 3 Parallel Agent Execution">Task queue, one worker per task, branch/worktree isolation, concurrency limits, per-agent budgets, and human review queue. Review bandwidth, not agent count, is the ceiling.</Phase>
      <Phase name="Phase 4 Production Agent Platform">Full tracing, eval dashboards, approval workflows, rollback hooks, audit logs, cost monitoring, model/tool version pinning, and golden task regression suite.</Phase>
    </DeploymentPhases>

    <TrustBoundary>The moat is governed loop infrastructure with memory, grounding, isolation, verification, and reusable product knowledge. The system must not become an unchecked code or report generator.</TrustBoundary>

  <VerifierChecks status="hard-gate">
    <Check name="Evidence binding">Every material claim maps to attached context, returned MCP evidence, REST evidence, fixture evidence, or memory explicitly marked as memory.</Check>
    <Check name="No invented sources">No fake filings, tickers, accession numbers, links, route names, prices, or tool outputs.</Check>
    <Check name="Missing data disclosure">Missing evidence stays visible as missing.</Check>
    <Check name="Boundary preservation">Second-level links are not treated as fetched evidence unless fetched.</Check>
    <Check name="Non-advice compliance">No personalized investment advice, price targets, portfolio instructions, buy/sell commands, or order instructions.</Check>
    <Check name="Maker/checker separation">Verifier must not be the same agent instance that drafted the output.</Check>
    <Check name="Source metadata preservation">Source dates, computed times, stale flags, caveats, quality flags, hashes, payload mode, and route/tool provenance are included where available.</Check>
    <Check name="Memory integrity">New memory does not overwrite prior River claims without recording status as confirmed, weakened, contradicted, or unresolved.</Check>
    <Check name="Stop-condition satisfaction">Claimed completion state matches the actual verifier result.</Check>
    <Check name="Budget compliance">Iterations, tool calls, elapsed time, and estimated cost remain inside budget.</Check>
  </VerifierChecks>

  <JudgeNarrative>
    <Opening>DeltaSignal is not another filing chatbot or generic deep-research wrapper. It turns proprietary financial research into executable agent memory. One TripCode resolves a published article into a machine-readable research packet, reconstructs the prior thesis River, compares that thesis against SEC/XBRL-backed evidence, and returns what changed, what weakened, what remains unproven, and what to monitor next with provenance, uncertainty, and non-advice boundaries preserved.</Opening>
    <RuntimeAutonomy>The submitted agent performs the runtime research workflow autonomously after the user provides one TripCode or issuer prompt. DeltaSignal Gemini AI Agent is the runtime product agent judges can call.</RuntimeAutonomy>
    <TrackOne title="Track 1 - Build: A Working Agent, Not a Slideware Concept">The submitted system is a Go-native Cloud Run agent built for judge-safe reproducibility and live integration. It exposes health, brief-generation, usage, TripCode, and judge shortcut routes; supports deterministic demo fixtures; and runs the live DeltaSignal ATLAS-7 MCP mode when the proper API key is supplied. The core build is an autonomous TripCode workflow: a stable article code becomes an executable research object with article memory, River continuity, filing references, thesis evolution, missing evidence, caveats, and monitor-next items. The agent moves beyond reporting by resolving the handle, calling external tools through MCP, reconstructing state, comparing evidence, preserving session memory, and returning a diligence packet. The HUT proof case demonstrates this workflow concretely through TF-SUB-9DA70A7F98, which resolves the Hut 8 article, reconstructs a 10-node HUT River, and returns changed findings, weakened assumptions, confirmed signals, execution bridge risks, proof milestones, invalidation logic, scenario framing, and a monitoring checklist.</TrackOne>
    <TrackTwo title="Track 2 - Optimize: Grounded, Auditable, Cost-Controlled">The system is optimized around judge trust: deterministic fallback mode, live MCP mode behind explicit configuration, Gemini synthesis through Vertex AI, bounded session memory, protected demo access, local-estimate usage tracking, runtime telemetry, structured logs, and configurable rate limits. The audit reports 100 percent test coverage, clean go vet, no discovered secrets or credentials, correct ignore rules, distroless nonroot deployment posture, and clean separation between demo, live MCP, and Gemini paths. The strongest optimization is evidence discipline: the agent separates article-derived claims, filing-backed claims, MCP evidence, inference, missing data, identity boundaries, and non-advice language. The evidence-fidelity increment surfaces an evidence_fidelity summary through /v1/brief and the Gemini prompt path, while the runtime-hardening increment exposes request_id, trace_id, duration, rate-limit state, and memory backend status through every protected response.</TrackTwo>
    <TrackThree title="Track 3 - Path: From Research Agent to Agent Network">DeltaSignal's path is larger than a single demo. TripCodes create stable handles for proprietary research memory. Rivers organize articles into evolving thesis trails. ATLAS-7 provides the evidence layer. Gemini supplies synthesis. MCP provides the evidence interface. The first Track 3 slice now exposes A2A agent-card discovery and a protected /a2a task endpoint so other agents can discover and invoke the TripCode research-packet workflow while preserving provenance and boundaries.</TrackThree>
    <WhyThisWins>Generic agents answer questions; DeltaSignal preserves a research lineage. Filing agents compare documents; DeltaSignal reconciles prior thesis claims against newer evidence. Search systems find content; DeltaSignal makes the content executable by agents.</WhyThisWins>
    <JudgeClose>DeltaSignal's competition advantage is simple: one TripCode converts a passive research archive into an auditable, agent-executable diligence workflow. The demo proves build readiness, the audit proves engineering discipline, and the architecture shows a credible path from single-agent resolution to multi-agent financial research infrastructure.</JudgeClose>
