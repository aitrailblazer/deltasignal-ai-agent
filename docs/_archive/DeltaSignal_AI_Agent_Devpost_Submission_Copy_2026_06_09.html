    import { LitElement, html, css } from 'https://unpkg.com/lit@3/index.js?module';

    const xml = document.getElementById('strategix-devpost-copy-contract')?.textContent.trim() ?? '';
    const liveUrl = 'https://deltasignal-ai-agent-mhaufviwaq-uc.a.run.app';
    const fields = [
      ['Project title', 'DeltaSignal Gemini AI Agent'],
      ['Short description', 'DeltaSignal Gemini AI Agent turns one TripCode into an agent-executable financial diligence packet: article memory, thesis River, filing-backed evidence refs, what changed, what weakened, what remains unproven, and what to monitor next.'],
      ['Problem to solve', `Financial research is often trapped in static articles, PDFs, filings, and archive search. Analysts can find documents, but they still have to manually reconstruct what prior research claimed, which evidence supported it, which assumptions weakened, and what should be monitored next. That manual continuity problem gets worse when research spans newsletters, SEC/XBRL evidence, issuer histories, and follow-up notes. DeltaSignal solves the continuity problem: one stable TripCode lets an agent recover the research object, reconstruct the thesis River, compare claims against evidence, and return a bounded diligence packet.`],
      ['Our solution', `DeltaSignal Gemini AI Agent is a Go-native Cloud Run agent for issuer intelligence. A user gives one TripCode or issuer prompt. The agent autonomously calls the live DeltaSignal ATLAS-7 MCP composite resolver, reconstructs the research River, separates article memory from filing-backed evidence, writes compact session memory, asks Gemini through Vertex AI to synthesize the result, and returns a judge-ready diligence packet with execution_trace, agent_context.sources, research_packet, session_memory, gemini_summary, usage, and boundaries. The HUT proof case, TF-SUB-9DA70A7F98, resolves into a 10-node HUT River with zero missing evidence in the latest validation run.`],
      ['Technologies used', `Go, Cloud Run, Cloud Build, Artifact Registry, Secret Manager, Vertex AI / Gemini, Google Gen AI SDK for Go, MCP-compatible tool calls, A2A agent-card discovery, JSON-RPC task endpoint, structured Cloud Run logs, local-estimate usage ledger, and deterministic demo fixtures for judge-safe fallback.`],
      ['Data sources', `DeltaSignal ATLAS-7 SEC/XBRL-grounded issuer intelligence, DeltaSignal TripCode research objects, thesis River packets, filing evidence refs, article memory objects, deterministic HUT demo fixtures, and public ATLAS-7 operating guides fetched as agent_context sources. ATLAS-7 is disclosed as an existing authorized integration and data source; this competition project is the new Google Cloud agent orchestration layer.`],
      ['Findings and learnings', `The strongest agent value is not generic filing summarization. It is continuity. TripCodes convert passive financial commentary into structured research memory that an agent can resolve, inspect, compare, and monitor. The HUT proof showed that a single TripCode can recover the current article, prior River nodes, changed findings, weakened assumptions, execution risks, proof milestones, and next monitoring items. We also learned that judges need visible cost discipline, so the service uses Cloud Run min-instances=0, protected judge keys, bounded rate limits, and per-request local cost estimates.`],
      ['Third-party integrations', `Google Cloud services: Cloud Run, Cloud Build, Artifact Registry, Secret Manager, Vertex AI / Gemini, and Cloud Logging. DeltaSignal ATLAS-7 MCP is an authorized integration/data source used for issuer evidence and TripCode research packets. The agent preserves source boundaries and does not treat TripCodes as official SEC identifiers.`],
      ['Readiness for launch', `The Build demo is deployed and validated on Cloud Run. The latest proof run returned live-mcp-tripcode-gemini mode with no live_mcp_error, 10 HUT River nodes, zero missing evidence, Gemini summary, session-memory follow-up, A2A first-turn/follow-up validation, and local-estimate usage reporting. Remaining production work is Optimize-layer hardening: managed durable memory, broader simulation/evaluation packs, formal dashboards, and official billing export.`],
      ['Critical Agent Platform feature', `The most critical capability is secure tool/context integration plus managed runtime execution: the agent has to call bounded evidence tools, preserve provenance, and return a structured packet without exposing secrets. Secret Manager, Cloud Run, Gemini synthesis, and MCP-compatible tool boundaries make the workflow repeatable and judge-testable. The missing future feature that would help most is a first-class Go-native ADK/Agent Runtime path with managed Sessions and Memory Bank equivalent to the Python examples.`],
      ['API capability that would save 2+ hours', `A native Go Agent Runtime SDK path for registering tools, sessions, memory, tracing, and A2A/Marketplace metadata in one deployable package would save significant integration time. We implemented the runtime in Go directly for consistency, but official Go-first helpers for managed memory, trace correlation, and agent-card publication would accelerate production hardening.`],
      ['Additional information', `The project is intentionally bounded. It is not an investment-advice bot. It is an evidence-routing and diligence-triage agent. TripCodes are resolver anchors, not official evidence. SEC/XBRL identifiers remain the source identities. The public materials keep private competition PDFs, secrets, and internal-only implementation history out of the judge surface.`]
    ];
    const assets = [
      ['Video', 'Record against the live Cloud Run service. Show /health, /resolve for TF-SUB-9DA70A7F98, same-session follow-up, /v1/usage, and optionally A2A.'],
      ['Code', 'https://github.com/aitrailblazer/deltasignal-ai-agent'],
      ['Testing access', `${liveUrl}. Protected judge routes require the privately supplied X-Demo-Key / DELTASIGNAL_DEMO_API_KEY. Do not put the key in public materials.`],
      ['Architecture diagram', 'Use the architecture section in the official submission packet or landing page: user -> Cloud Run agent -> MCP composite resolver -> ATLAS-7 evidence -> Gemini synthesis -> session memory -> diligence packet.']
    ];
    const proof = [
      ['Live service', `${liveUrl}`],
      ['TripCode proof', 'TF-SUB-9DA70A7F98'],
      ['Latest result', 'live-mcp-tripcode-gemini, 10 HUT River nodes, zero missing evidence, Gemini summary, session memory, usage, and boundaries.'],
      ['Source freeze', 'deltasignal-ai-agent evidence commit 88a9c8f; ATLAS-7 MCP source commit 14686aa6; MCP revision ca-web-intel-mcp--0000510.']
    ];
    const commands = `# Health
curl -s "${liveUrl}/health"

# Resolve HUT TripCode, protected by private judge key
curl -s "${liveUrl}/resolve?tripcode=TF-SUB-9DA70A7F98&session_id=judge-demo&issuer=HUT&payload_mode=compact&include_filing_evidence=true&include_prior_articles=true&include_thesis_map=true" \\
  -H "X-Demo-Key: $JUDGE_DEMO_KEY"

# Same-session follow-up, proves session memory
curl -s -X POST "${liveUrl}/resolve?session_id=judge-demo" \\
  -H "X-Demo-Key: $JUDGE_DEMO_KEY" \\
  -H "Content-Type: text/plain" \\
  --data "Using the previous HUT River, what are the top 3 things to monitor next?"

# Usage ledger
curl -s "${liveUrl}/v1/usage" -H "X-Demo-Key: $JUDGE_DEMO_KEY"

# A2A discovery
curl -s "${liveUrl}/.well-known/agent-card.json"`;
