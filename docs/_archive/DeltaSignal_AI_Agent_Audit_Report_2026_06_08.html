      <Observation>Makefile does -include .env + export (standard pattern). This exports variables to child processes when present. Discipline is required; the .gitignore protects .env.</Observation>
    </Category>

    </Category>

    </Priority>

      <Item>Consider adding a small "EvidenceEnvelope" or "Provenance" struct that both the brief findings and the TripCode packet can populate so downstream consumers (Gemini, judges, clients) receive consistent fields.</Item>
    </Priority>

    <Priority level="medium" category="Robustness &amp; Observability">
      <Item>Add lightweight structured request logging (or at minimum correlation IDs) on the server so Cloud Run logs can be correlated with cost entries and MCP calls.</Item>
      <Item>Document (in README or a short note in the submission packet) that session memory is in-memory only and will not survive Cloud Run restarts or scale events. If multi-turn judge scenarios become important, evaluate a minimal Redis or Firestore-backed store behind a flag.</Item>
      <Item>Add a simple health or readiness probe that reports whether live MCP key is configured and whether the last known MCP call succeeded (without exposing the key).</Item>
    </Priority>

      <Item>Add a small boundary-compliance test that asserts the presence of the four required disclosures and non-advice language in both demo and (mocked) live responses.</Item>
      <Item>Consider a lightweight "golden packet" test for the HUT TripCode path (TF-SUB-9DA70A7F98) that can run without live MCP when the composite is unavailable.</Item>
      <Item>If the project grows, introduce a minimal evaluation harness that scores tool selection accuracy, citation/grounding rate, and refusal behavior on a small synthetic set.</Item>
    </Priority>
