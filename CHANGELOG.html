  <CostPolicy>
    <Budget>Google Cloud startup credits are limited to 500 USD for the challenge window.</Budget>
    <Rule>Default to deterministic local/demo mode unless a live Gemini or MCP call is required for the judge demo.</Rule>
    <Rule>Cloud Run uses min-instances=0, max-instances=3, 512Mi memory, 1 CPU, and concurrency 80 to avoid idle burn.</Rule>
    <Rule>Live Gemini mode must use Google Cloud / Vertex AI for credit alignment, not Google AI Studio keys.</Rule>
    <Rule>Every successful brief or TripCode test response can include a local-estimate cost object when DELTASIGNAL_COST_TRACKING=true.</Rule>
    <Boundary>Exact Google account spend and remaining credits require Google Cloud Billing export or the Billing console; the application estimate is immediate but not an official billing record.</Boundary>
  </CostPolicy>

      <Title>Added public cost-conscious test-spend controls</Title>
      <Detail>Added DELTASIGNAL_COST_TRACKING, DELTASIGNAL_GOOGLE_CREDIT_BUDGET_USD, and per-request estimate envs.</Detail>
      <Detail>Added cost metadata to successful /v1/brief and /v1/tripcode responses.</Detail>
      <Detail>Added GET /v1/usage for the current local estimate ledger.</Detail>
      <Detail>Updated the demo client to print request cost, tracked spend, and estimated remaining budget.</Detail>
    </Entry>
    <Entry date="2026-06-07" type="quality-gate">
      <Title>Added 100 percent local coverage gate</Title>
      <Detail>Added make coverage and wired make check to run tests, coverage, and vet.</Detail>
      <Detail>Current coverage gate reports total 100.0 percent statements.</Detail>
    </Entry>
    <Entry date="2026-06-07" type="mcp-tripcode">
      <Title>Implemented Go-native TripCode MCP path</Title>
      <Detail>Added live MCP JSON-RPC client for deltasignal_resolve_tripcode_research_packet.</Detail>
      <Detail>Added POST /v1/tripcode with session memory and optional Gemini synthesis.</Detail>
      <Detail>Added judge-friendly GET/POST /resolve shortcut that maps one TripCode and session_id into the same resolver and Memory Bank path.</Detail>
      <Detail>Added scripts/judge-demo.sh to show TripCode resolution, multi-turn memory, and cost ledger checks with curl.</Detail>
      <Detail>Added two-turn cmd/tripcode-demo for judge video flow.</Detail>
    </Entry>
    <Entry date="2026-06-07" type="deployment">
      <Title>Hardened Cloud Run demo posture</Title>
      <Detail>Added Makefile, optimized Dockerfile, Cloud Build template, and Secret Manager-safe env guidance.</Detail>
      <Detail>Public demo can be protected by DELTASIGNAL_DEMO_API_KEY while health remains public.</Detail>
    </Entry>
    <Entry date="2026-06-08" type="audit">
      <Title>Added codebase and integration audit report</Title>
      <Detail>Added docs/DeltaSignal_AI_Agent_Audit_Report_2026_06_08.html as a StrategiX Visual Spec audit artifact.</Detail>
      <Detail>Audit records 92 health score, 100 percent coverage gate, clean secret posture, nested git boundary, and evidence metadata follow-up.</Detail>
      <Detail>Linked the audit from the official submission packet as supporting evidence, not a replacement for the packet.</Detail>
      <Detail>Neutralized external model/vendor attribution in the audit report so public judge-facing materials stay focused on DeltaSignal, Google Cloud, Gemini, MCP, and the Go implementation.</Detail>
    </Entry>
    <Entry date="2026-06-08" type="submission-packet">
      <Title>Versioned official submission packet to 1.2</Title>
      <Detail>Updated docs/DeltaSignal_AI_Agent_Submission_Packet_2026_06_04.html from version 1.1 to 1.2.</Detail>
      <Detail>Added judge-scoring priorities for Cloud Run deployment, TripCode-first demo, /v1/brief provenance parity, broader agent framing, and nested repo freeze.</Detail>
      <Detail>Added explicit Risks And Open Questions plus Source Digest sections to close the packet evaluation gap.</Detail>
      <Detail>Marked the live demo URL as deployment-pending until the Cloud Run endpoint replaces the placeholder.</Detail>
    </Entry>
    <Entry date="2026-06-08" type="submission-packet">
      <Title>Versioned official submission packet to 1.3</Title>
      <Detail>Added three-track framing for Google for Startups AI Agents Challenge scoring.</Detail>
      <Detail>Positioned Track 1 Build as the primary submission track around TripCode to River to evidence reconciliation.</Detail>
      <Detail>Positioned Track 2 Optimize as the reliability, observability, grounding, durable-memory, and provenance-fidelity hardening layer.</Detail>
      <Detail>Positioned Track 3 as the future interoperability path for portfolio, compliance, data-room, and research agents.</Detail>
    </Entry>
    <Entry date="2026-06-08" type="submission-packet">
      <Title>Versioned official submission packet to 1.4</Title>
      <Detail>Added plain-language Track 1 / Track 2 / Track 3 judge narrative.</Detail>
      <Detail>Clarified that the submission is a working Go-native Cloud Run agent, not a slideware concept.</Detail>
      <Detail>Clarified Track 2 as grounded, auditable, cost-controlled optimization with evidence discipline.</Detail>
      <Detail>Added judge close positioning TripCodes as the bridge from passive research archives to auditable agent-executable diligence workflows.</Detail>
    </Entry>
    <Entry date="2026-06-08" type="submission-packet">
      <Title>Versioned official submission packet to 1.5</Title>

      <Detail>Added compact Build / Optimize / Path replacement language for judge scanning.</Detail>
      <Detail>Added Track Progression: TripCode in, River reconstructed, evidence compared, memory preserved, cost shown.</Detail>
    </Entry>

      <Detail>Verified make check passes with total Go coverage at 100.0 percent.</Detail>
    </Entry>

      <Detail>Configured the judge deployment for live MCP, Gemini through Vertex AI, local cost tracking, min-instances=0, max-instances=3, 512Mi memory, 1 CPU, and concurrency 80.</Detail>
      <Detail>First Cloud Build submission failed before build because the default _IMAGE substitution used an unexpanded $PROJECT_ID token; fixed Makefile to pass a concrete Artifact Registry image.</Detail>
      <Detail>First deployed judge run reached the Go service but exposed a live MCP header issue caused by newline-bearing secret material; patched the MCP client to trim API keys before sending X-API-Key.</Detail>
      <Detail>Added GET /health as the deployment smoke route because the deployed /healthz path returned a Google front-end 404 while protected application routes reached the service.</Detail>
    </Entry>

      <Detail>Verified POST /resolve with the same session_id returns session-memory mode and preserves the prior HUT River context for follow-up questions.</Detail>
      <Detail>Verified GET /v1/usage returns local-estimate tracking after the judge flow: 0.10 USD spent and 499.90 USD remaining from the configured 500 USD budget.</Detail>
      <Detail>Documented that the public ATLAS-7 MCP endpoint does not yet expose deltasignal_resolve_tripcode_research_packet; the Cloud Run service therefore reports live_mcp_error and falls back to the deterministic HUT River fixture for judge-safe Build validation.</Detail>
    </Entry>

      <Detail>Ran scripts/judge-demo.sh against the live Cloud Run service; /resolve returned mode live-mcp-tripcode-gemini, status ready, the full research_packet, 10 HUT River nodes, filing evidence refs, Gemini synthesis, and session-memory continuity.</Detail>

      <Detail>Updated scripts/judge-demo.sh so future judge runs write redacted request JSON and full raw response JSON into artifacts/judge-demo/&lt;run_id&gt;/ automatically.</Detail>
      <Detail>Added BUILD_PHASE_EXPLANATION.html to each judge-demo artifact session so the evidence folder explains the Track 1 Build phase step by step.</Detail>
      <Detail>Expanded the Build evidence note with an explicit Google agent versus ATLAS-7 MCP role split and justification for why the agent orchestrates while MCP supplies bounded evidence.</Detail>
      <Detail>Added objective, evaluation criteria, Build pass status, and the reason Optimize is the next phase: evidence-fidelity propagation across every user-facing brief path.</Detail>
      <Detail>Kept demo keys redacted and preserved the boundary that official Google Cloud billing still requires Billing export or console data.</Detail>
    </Entry>
  </Entries>
