                    <button class="cap-tab ${item.id===this.capability?'active':''}" role="tab" aria-selected=${item.id===this.capability} @click=${()=>this.capability=item.id}>
                      <span class="cap-number">${item.number}</span><span class="cap-label">${item.label}</span><span class="cap-arrow">→</span>
                    </button>

                <article class="cap-panel" data-accent=${selected.accent} aria-live="polite">
                  <div class="cap-icon">${selected.icon}</div>
                  <h3>${selected.title}</h3>

                    <div class="demo-point"><b>Presentation mode</b><span>Purpose-built for a clean 16:10 or 16:9 recording.</span></div>
                    <div class="demo-point"><b>Four specialists</b><span>Filing, history, point-in-time, and applicability.</span></div>
                    <div class="demo-point"><b>Visible proof boundary</b><span>Facts, interpretation, unresolved claims, provenance.</span></div>

                <a class="demo-visual" href="./client-demo/google-cloud-aapl/" aria-label="Open the interactive AAPL client demo">

                  <span class="visual-badge">DAILY EVIDENCE → MCP → GOOGLE AGENTS</span>

            <section class="content shell" id="workflow">

              <div class="workflow">
                ${workflow.map(([num,label,detail])=>html`<article class="work-step"><span class="work-num">${num} · ${label}</span><b>${detail}</b><span>${this.workflowNote(label)}</span></article>`)}

              <div class="proof-grid">
                ${proof.map(([title,body])=>html`<article class="proof-card"><b>${title}</b><p>${body}</p></article>`)}

      workflowNote(label){
        return ({
          SOURCE:'Filings, structured facts, dated observations.',
          GOVERN:'Identity, time, units, quality, missingness.',
          ROUTE:'Discover contract, check access, call tool.',
          DELEGATE:'Narrow specialists retrieve independent lanes.',
          REVIEW:'Classify facts and check contradictions.',
          DELIVER:'Return provenance-rich evidence packet.'
