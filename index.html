      renderCompetition(){
        const slide=competitionSlides[this.competitionSlide];
        return html`
          <main class="competition-theater" aria-label="DeltaSignal product presentation">

              <div class="competition-track">LIVE PRODUCT TOUR · EVIDENCE INFRASTRUCTURE</div>
            </div>
            <section class="competition-stage">
              <div class="competition-copy" data-accent=${slide.accent}>
                <div class="competition-eyebrow">${slide.eyebrow}</div>
                <h1>${slide.title}</h1>
                <p>${slide.body}</p>
                <div class="slide-index"><b>${String(this.competitionSlide+1).padStart(2,'0')}</b> / ${String(competitionSlides.length).padStart(2,'0')} · ${slide.id.toUpperCase()}</div>
              </div>
              <div class="competition-visual" aria-hidden="true">
                <div class="orbital"></div>
                ${this.competitionVisual(slide.visual)}
              </div>
            </section>
            <div class="competition-bottom">
              <div class="competition-controls">
                <button @click=${()=>this.setCompetitionSlide(this.competitionSlide-1)} ?disabled=${this.competitionSlide===0} aria-label="Previous slide">←</button>
                <button class="play" @click=${this.toggleCompetitionPlay}>${this.competitionPlaying?'❚❚ Pause':'▶ Auto play'}</button>
                <button @click=${()=>this.setCompetitionSlide(this.competitionSlide+1)} ?disabled=${this.competitionSlide===competitionSlides.length-1} aria-label="Next slide">→</button>
              </div>
              <div class="competition-progress"><span>${String(this.competitionSlide+1).padStart(2,'0')} / ${String(competitionSlides.length).padStart(2,'0')}</span><div class="competition-trackline"><i style=${`width:${((this.competitionSlide+1)/competitionSlides.length)*100}%`}></i></div></div>
              <span class="record-safe">← → NAVIGATE · SPACE AUTOPLAY · ESC EXIT</span>
              <button class="competition-exit" @click=${this.exitCompetition}>Exit presentation</button>
            </div>
          </main>
        `;
      }

      competitionVisual(kind){
        if(kind==='proof')return html`
          <div class="visual-core">
            <h3>HUT research packet</h3><p class="mono">TF-SUB-9DA70A7F98 → TF-RIVER-HUT</p>
            <div class="competition-proof">
              <div><b>10</b><small>River nodes</small></div><div><b>9</b><small>Prior research nodes</small></div>
              <div><b>4</b><small>Changed findings</small></div><div><b>8</b><small>Monitor-next items</small></div>
            </div>
          </div>`;
        if(kind==='ecosystem')return html`
          <div class="visual-core">
            <h3>Specialist evidence node</h3><p>One bounded packet. Multiple enterprise consumers.</p>
            <div class="visual-stack">
              ${['Portfolio agent','Compliance agent','Data-room agent','Subscriber copilot'].map((name,index)=>html`<div class="visual-line"><i>${['P','C','D','S'][index]}</i><span><b>${name}</b><small>discover · invoke · verify · reuse</small></span><span>CONNECTED</span></div>`)}
            </div>
          </div>`;
        if(kind==='problem')return html`
          <div class="visual-core">
            <h3>Trust deficit</h3><p>Fluent answers without inspectable evidence.</p>
            <div class="visual-stack">
              <div class="visual-line"><i>?</i><span><b>Source identity</b><small>hidden or omitted</small></span><span style="color:var(--red)">MISSING</span></div>
              <div class="visual-line"><i>?</i><span><b>Point-in-time state</b><small>today’s facts leak backward</small></span><span style="color:var(--red)">UNSAFE</span></div>
              <div class="visual-line"><i>?</i><span><b>Evidence vs inference</b><small>blurred into one answer</small></span><span style="color:var(--red)">BLURRED</span></div>
            </div>
          </div>`;
        return html`
          <div class="visual-core">
            <h3>${kind==='close'?'Inspectable intelligence':'AAPL evidence loop'}</h3>
            <p>${kind==='close'?'Proof remains attached to the answer.':'Apple is the reference. The workflow is reusable.'}</p>
            <div class="visual-stack">
              <div class="visual-line"><i>◇</i><span><b>Agent Card + A2A</b><small>public discovery · protected execution</small></span><span>DISCOVER</span></div>
              <div class="visual-line"><i>§</i><span><b>ATLAS-7 + SEC/XBRL</b><small>bounded MCP evidence products</small></span><span>VERIFY</span></div>
              <div class="visual-line"><i>◎</i><span><b>Gemini + Cloud Run</b><small>orchestration · explanation · telemetry</small></span><span>EXPLAIN</span></div>
              <div class="visual-line"><i>→</i><span><b>Reusable research packet</b><small>memory · caveats · monitor-next</small></span><span>RETURN</span></div>
            </div>
          </div>`;
      }

      setCompetitionSlide(index){
        this.competitionSlide=Math.max(0,Math.min(competitionSlides.length-1,index));
        if(this.competitionSlide===competitionSlides.length-1&&this.competitionPlaying)this.stopCompetitionPlay();
      }

      toggleCompetitionPlay=()=>{
        if(this.competitionPlaying){this.stopCompetitionPlay();return}
        if(this.competitionSlide===competitionSlides.length-1)this.competitionSlide=0;
        this.competitionPlaying=true;
        this.competitionTimer=setInterval(()=>{
          if(this.competitionSlide===competitionSlides.length-1){this.stopCompetitionPlay();return}
          this.competitionSlide+=1;
        },6500);
      }

      stopCompetitionPlay(){
        if(this.competitionTimer)clearInterval(this.competitionTimer);
        this.competitionTimer=null;
        this.competitionPlaying=false;
      }

      exitCompetition=()=>{
        this.stopCompetitionPlay();
        history.replaceState(null,'',location.pathname);
        this.competitionMode=false;
        this.competitionSlide=0;
        window.scrollTo({top:0});
      }

      workflowNote(label){
        return ({
          SOURCE:'Filings, structured facts, dated observations.',
          GOVERN:'Identity, time, units, quality, missingness.',
          ROUTE:'Discover contract, check access, call tool.',
          DELEGATE:'Narrow specialists retrieve independent lanes.',
          REVIEW:'Classify facts and check contradictions.',
          DELIVER:'Return provenance-rich evidence packet.'
        })[label];
      }
    }

    customElements.define('deltasignal-site',DeltaSignalSite);
  </script>
