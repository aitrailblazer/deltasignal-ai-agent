    const workflow = [

      ['Plan', 'Coordinator decomposes into stress, fundamentals, peer, and review lanes.'],

      ['Gemini / Vertex AI', 'Production model path for competition credit alignment and enterprise controls.'],
      ['DeltaSignal ATLAS-7', 'Disclosed integration for SEC/XBRL-grounded issuer intelligence and bounded workflows.'],

        }

        .shell { min-height: 100vh; background: #07090d; }
        header {

          inset: 0 0 auto 0;

          min-height: 92svh;
          position: relative;
          overflow: hidden;
          display: grid;
          align-items: end;

GOWORK=off go run ./cmd/server

curl -s http://localhost:8080/v1/brief \\
