steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - deltasignal-ai-agent
      - --image
      - ${_IMAGE}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --min-instances
      - "0"
      - --max-instances
      - "3"
      - --memory
      - 512Mi
      - --cpu
      - "1"
      - --concurrency
      - "80"
      - --set-env-vars
      - GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=true,DELTASIGNAL_USE_GEMINI=true,GEMINI_MODEL=gemini-2.5-flash,DELTASIGNAL_USE_LIVE_MCP=true,DELTASIGNAL_ENABLE_TRIPCODE_FALLBACK=true,DELTASIGNAL_COST_TRACKING=true,DELTASIGNAL_GOOGLE_CREDIT_BUDGET_USD=500,DELTASIGNAL_ESTIMATED_BRIEF_COST_USD=0.02,DELTASIGNAL_ESTIMATED_TRIPCODE_COST_USD=0.05,DELTASIGNAL_ESTIMATED_SESSION_MEMORY_COST_USD=0.00,DELTASIGNAL_COST_SOURCE=local-estimate,DELTASIGNAL_BILLING_PROJECT_ID=${PROJECT_ID},DELTASIGNAL_BILLING_ENABLED=true,DELTASIGNAL_BILLING_ACCOUNT_NAME=billingAccounts/018530-615AB8-696753,DELTASIGNAL_RATE_LIMIT_ENABLED=true,DELTASIGNAL_RATE_LIMIT_PER_WINDOW=30,DELTASIGNAL_RATE_LIMIT_WINDOW_SECONDS=60,DELTASIGNAL_MEMORY_MAX_ENTRIES=20,DELTASIGNAL_PUBLIC_BASE_URL=https://deltasignal-ai-agent-mhaufviwaq-uc.a.run.app,DELTASIGNAL_A2A_PROTOCOL_VERSION=0.3.0,DELTASIGNAL_AGENT_VERSION=1.0.0
      - --set-secrets
      - MCP_API_KEY=deltasignal-mcp-api-key:latest,DELTASIGNAL_DEMO_API_KEY=deltasignal-demo-api-key:latest
substitutions:
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/startup-ai-deltasignal/deltasignal-ai-agent/app:latest
images:
  - ${_IMAGE}
